name: Release

# Сборка ВСЕХ платформ и публикация в GitHub Releases.
# Платформы: macOS (Electron), Windows (Electron), Android Touch, Android TV

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  # ── Desktop: macOS + Windows ──
  mac:
    name: 'macOS (.dmg)'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run selftest
      - run: npm run build
      - run: node scripts/fetch-torrserver.js --platform darwin
      - run: npx electron-builder --mac --x64 --arm64
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: apps/desktop/release/Luminary-*.dmg

  windows:
    name: 'Windows (.exe)'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run selftest
      - run: npm run build
      - run: node scripts/fetch-torrserver.js --platform win32
      - run: npx electron-builder --win nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: apps/desktop/release/Luminary-*-Setup.exe

  # ── Android: Touch + TV APK ──
  android-touch:
    name: 'Android Touch (phone/tablet)'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx vite build
      - name: Fetch TorrServer Android binary
        run: |
          mkdir -p android/app/src/main/assets/torrserver
          curl -sL -o android/app/src/main/assets/torrserver/TorrServer-android-arm64 \
            "https://github.com/YouROK/TorrServer/releases/latest/download/TorrServer-android-arm64"
          chmod +x android/app/src/main/assets/torrserver/TorrServer-android-arm64
      - run: npx cap add android || true
      - run: npx cap sync android
      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release-key.jks \
            -storepass luminary123 -alias luminary -keypass luminary123 \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=Luminary, OU=Dev, O=Luminary, L=Unknown, S=Unknown, C=US"
      - name: Build APK
        run: cd android && ./gradlew assembleRelease
      - name: Sign APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)/apksigner sign \
            --ks android/app/release-key.jks --ks-pass pass:luminary123 \
            --key-pass pass:luminary123 --ks-key-alias luminary "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: android-touch
          path: apps/android/android/app/build/outputs/apk/release/*.apk

  android-tv:
    name: 'Android TV'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx vite build
      - name: Fetch TorrServer Android binary
        run: |
          mkdir -p android/app/src/main/assets/torrserver
          curl -sL -o android/app/src/main/assets/torrserver/TorrServer-android-arm64 \
            "https://github.com/YouROK/TorrServer/releases/latest/download/TorrServer-android-arm64"
          chmod +x android/app/src/main/assets/torrserver/TorrServer-android-arm64
      - run: npx cap add android || true
      - run: npx cap sync android
      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release-key.jks \
            -storepass luminary123 -alias luminary -keypass luminary123 \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=Luminary, OU=Dev, O=Luminary, L=Unknown, S=Unknown, C=US"
      - name: Build APK
        run: cd android && ./gradlew assembleRelease
      - name: Sign APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)/apksigner sign \
            --ks android/app/release-key.jks --ks-pass pass:luminary123 \
            --key-pass pass:luminary123 --ks-key-alias luminary "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: android-tv
          path: apps/android-tv/android/app/build/outputs/apk/release/*.apk

  # ── Release: собрать все артефакты ──
  release:
    name: 'Publish GitHub Release'
    needs: [mac, windows, android-touch, android-tv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts/mac -name '*.dmg' -exec cp {} release/ \;
          find artifacts/windows -name '*-Setup.exe' -exec cp {} release/ \;
          find artifacts/android-touch -name '*.apk' -exec cp {} "release/Luminary-${GITHUB_REF_NAME:-dev}-android.apk" \;
          find artifacts/android-tv -name '*.apk' -exec cp {} "release/Luminary-${GITHUB_REF_NAME:-dev}-android-tv.apk" \;
          echo "=== Release artifacts ==="
          ls -lh release/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-}"
          if [[ "$TAG" == v* ]]; then
            gh release create "$TAG" release/* \
              --title "Luminary $TAG" \
              --generate-notes
          else
            gh release create "draft-$(date +%s)" release/* \
              --draft --title "Luminary manual build"
          fi
