name: Release

# Сборка ВСЕХ платформ (macOS + Windows + Android) и публикация в GitHub Releases.
# Запуск: пуш тега v* — соберёт всё и создаст Release с артефактами.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  mac:
    name: 'macOS (.dmg)'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run selftest
      - run: npm run build
      - run: node scripts/fetch-torrserver.js --platform darwin
      - run: npx electron-builder --mac --x64 --arm64
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            apps/desktop/release/Luminary-*.dmg

  windows:
    name: 'Windows (.exe)'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run selftest
      - run: npm run build
      - run: node scripts/fetch-torrserver.js --platform win32
      - run: npx electron-builder --win nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/desktop/release/Luminary-*-Setup.exe

  android:
    name: 'Android (phone + TV APK)'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run selftest
      - run: npm run build
      - run: node scripts/fetch-torrserver.js --platform android
      - run: node scripts/set-android-icons.js
      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release-key.jks \
            -storepass luminary123 \
            -alias luminary \
            -keypass luminary123 \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=Luminary, OU=Dev, O=Luminary, L=Unknown, S=Unknown, C=US"
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android && ./gradlew assembleRelease
      - name: Sign APK with apksigner
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Signing: $APK"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)/apksigner sign \
            --ks android/app/release-key.jks \
            --ks-pass pass:luminary123 \
            --key-pass pass:luminary123 \
            --ks-key-alias luminary \
            "$APK"
          echo "Verifying..."
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)/apksigner verify -v "$APK" 2>&1 | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            apps/desktop/android/app/build/outputs/apk/release/*.apk

  release:
    name: 'Publish GitHub Release'
    needs: [mac, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts/mac -name '*.dmg' -exec cp {} release/ \;
          find artifacts/windows -name '*-Setup.exe' -exec cp {} release/ \;
          find artifacts/android -name '*.apk' -exec cp {} "release/Luminary-${GITHUB_REF_NAME:-dev}-android.apk" \;
          echo "Release artifacts:"
          ls -lh release/

      - name: Create release (tag) or draft (manual run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-}"
          if [[ "$TAG" == v* ]]; then
            gh release create "$TAG" release/* \
              --title "Luminary $TAG" \
              --generate-notes
          else
            gh release create "draft-$(date +%s)" release/* \
              --draft \
              --title "Luminary manual build"
          fi
